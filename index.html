<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>sorry baby ❤️</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: linear-gradient(145deg, #2b1a2e 0%, #1e1220 100%);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', 'Roboto', system-ui, -apple-system, sans-serif;
      padding: 16px;
      margin: 0;
      overflow: hidden;
      position: relative;
      touch-action: manipulation;
    }

    /* main card – glassy, soft */
    .card {
      background: rgba(255, 240, 245, 0.1);
      backdrop-filter: blur(12px) saturate(180%);
      -webkit-backdrop-filter: blur(12px) saturate(180%);
      border-radius: 56px 56px 48px 48px;
      padding: 32px 28px 40px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 30px 45px -20px rgba(0,0,0,0.8), 0 0 0 1px rgba(255, 200, 220, 0.15);
      border: 1px solid rgba(255, 220, 240, 0.2);
      text-align: center;
      position: relative;
      z-index: 10;
      transition: transform 0.2s ease;
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 500;
      letter-spacing: -0.3px;
      color: #ffe4ec;
      text-shadow: 0 4px 12px rgba(255, 80, 120, 0.3);
      margin-bottom: 16px;
      line-height: 1.3;
      word-break: break-word;
    }

    .big-text {
      font-size: 1.2rem;
      font-weight: 300;
      color: #ffd9e3;
      background: rgba(255, 200, 220, 0.08);
      padding: 16px 12px;
      border-radius: 60px;
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255, 180, 200, 0.15);
      margin-bottom: 32px;
      letter-spacing: 0.3px;
      line-height: 1.5;
      box-shadow: inset 0 2px 6px rgba(0,0,0,0.2);
    }

    .big-text span {
      display: inline-block;
      animation: pulseGlow 2.4s ease-in-out infinite;
    }

    @keyframes pulseGlow {
      0%, 100% { text-shadow: 0 0 6px #ff8aae; }
      50% { text-shadow: 0 0 20px #ff5f8a, 0 0 30px #ff3f7a; }
    }

    .button-group {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px 18px;
      margin: 12px 0 8px;
      position: relative;
      min-height: 80px;
      align-items: center;
    }

    .btn {
      display: inline-block;
      padding: 16px 40px;
      border: none;
      border-radius: 60px;
      font-size: 1.6rem;
      font-weight: 600;
      letter-spacing: 0.6px;
      background: #ff4d7a;
      color: white;
      box-shadow: 0 12px 24px -8px rgba(255, 30, 80, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.1);
      cursor: pointer;
      transition: all 0.15s ease;
      touch-action: manipulation;
      min-width: 120px;
      flex: 1 0 auto;
      max-width: 180px;
      position: relative;
      z-index: 20;
      text-shadow: 0 2px 4px rgba(0,0,0,0.2);
      transform: scale(1);
      will-change: transform, left, top, right, bottom;
    }

    .btn-yes {
      background: #ff3b6f;
      box-shadow: 0 12px 28px -6px #ff1f5a, 0 0 0 1px rgba(255, 120, 160, 0.3);
    }

    .btn-no {
      background: #6b4b5a;
      box-shadow: 0 12px 28px -6px #3f2a35, 0 0 0 1px rgba(200, 160, 170, 0.15);
    }

    .btn:active {
      transform: scale(0.94);
      transition-duration: 0.05s;
    }

    .btn-yes:active {
      box-shadow: 0 6px 14px -4px #ff1f5a;
    }
    .btn-no:active {
      box-shadow: 0 6px 14px -4px #2f1e26;
    }

    /* message after yes */
    .forgive-message {
      margin-top: 28px;
      font-size: 1.6rem;
      font-weight: 400;
      color: #ffd9e8;
      background: rgba(255, 80, 130, 0.25);
      backdrop-filter: blur(6px);
      padding: 18px 12px;
      border-radius: 60px;
      border: 1px solid rgba(255, 180, 200, 0.4);
      letter-spacing: 0.8px;
      animation: fadePop 0.5s cubic-bezier(0.2, 0.9, 0.3, 1.2);
      box-shadow: 0 8px 24px rgba(255, 30, 80, 0.3);
    }

    @keyframes fadePop {
      0% { opacity: 0; transform: scale(0.8) translateY(20px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }

    /* heart balloons (canvas) */
    #balloonCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      display: block;
      pointer-events: none;
      z-index: 1;
      opacity: 0.85;
    }

    /* small screens */
    @media (max-width: 480px) {
      .card {
        padding: 24px 18px 32px;
        border-radius: 40px 40px 32px 32px;
      }
      h1 {
        font-size: 1.5rem;
      }
      .big-text {
        font-size: 1rem;
        padding: 14px 10px;
      }
      .btn {
        font-size: 1.4rem;
        padding: 14px 24px;
        min-width: 100px;
        max-width: 150px;
        flex: 1 1 100px;
      }
      .button-group {
        gap: 16px 12px;
        min-height: 70px;
      }
      .forgive-message {
        font-size: 1.3rem;
        padding: 14px 10px;
      }
    }

    @media (max-width: 380px) {
      .btn {
        font-size: 1.2rem;
        padding: 12px 18px;
        min-width: 80px;
      }
      .big-text {
        font-size: 0.9rem;
      }
    }

    /* hide message initially */
    .hidden {
      display: none;
    }

    /* no button moving – will be handled by js */
    .btn-no--move {
      transition: left 0.2s ease, top 0.2s ease, right 0.2s ease, bottom 0.2s ease;
      position: relative;
    }
  </style>
</head>
<body>

  <!-- heart balloon canvas (behind card) -->
  <canvas id="balloonCanvas"></canvas>

  <!-- main card -->
  <div class="card" id="mainCard">
    <h1>💔 baby…</h1>
    <div class="big-text" id="apologyText">
      <span>I’m really sorry, baby.<br>Please forgive me ❤️</span>
    </div>

    <div class="button-group" id="buttonGroup">
      <button class="btn btn-yes" id="yesBtn">Yes</button>
      <button class="btn btn-no" id="noBtn">No</button>
    </div>

    <!-- hidden message (shown after yes) -->
    <div id="forgiveMsg" class="forgive-message hidden">
      ❤️ I know u will say yes ❤️
    </div>
  </div>

  <script>
    (function() {
      "use strict";

      // ---------- heart balloon canvas ----------
      const canvas = document.getElementById('balloonCanvas');
      const ctx = canvas.getContext('2d');
      let width, height;
      let hearts = [];
      const HEART_COUNT = 22; // enough floating around

      function resizeCanvas() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
      }
      window.addEventListener('resize', resizeCanvas);
      resizeCanvas();

      // heart shape path (scaled)
      function drawHeart(ctx, x, y, size, opacity, rotation) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(rotation || 0);
        ctx.scale(size / 20, size / 20); // base size 20px
        ctx.beginPath();
        ctx.moveTo(0, 6);
        ctx.bezierCurveTo(-6, -2, -12, 2, 0, 12);
        ctx.bezierCurveTo(12, 2, 6, -2, 0, 6);
        ctx.closePath();
        ctx.fillStyle = `rgba(255, 80, 130, ${opacity})`;
        ctx.shadowColor = 'rgba(255, 40, 80, 0.6)';
        ctx.shadowBlur = 18;
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.restore();
      }

      function createHeart() {
        const size = 14 + Math.random() * 24; // 14–38px
        return {
          x: Math.random() * width,
          y: Math.random() * height,
          size: size,
          speedX: (Math.random() - 0.5) * 0.7,
          speedY: -0.3 - Math.random() * 0.7,
          opacity: 0.3 + Math.random() * 0.5,
          rotation: (Math.random() - 0.5) * 0.5,
          phase: Math.random() * 100,
        };
      }

      for (let i = 0; i < HEART_COUNT; i++) {
        hearts.push(createHeart());
      }

      function animateHearts() {
        ctx.clearRect(0, 0, width, height);
        for (let h of hearts) {
          // move
          h.x += h.speedX + Math.sin(h.phase + Date.now() * 0.0008) * 0.25;
          h.y += h.speedY + Math.sin(h.phase + Date.now() * 0.001) * 0.15;

          // wrap around with smooth edge
          if (h.x < -20) h.x = width + 20;
          if (h.x > width + 20) h.x = -20;
          if (h.y < -20) h.y = height + 20;
          if (h.y > height + 20) h.y = -20;

          // subtle float
          const floatX = Math.sin(Date.now() * 0.001 + h.phase) * 0.5;
          const floatY = Math.cos(Date.now() * 0.0012 + h.phase) * 0.5;
          drawHeart(ctx, h.x + floatX, h.y + floatY, h.size, h.opacity, h.rotation + Math.sin(Date.now() * 0.0005 + h.phase) * 0.1);
        }
        requestAnimationFrame(animateHearts);
      }
      animateHearts();

      // ---------- button logic ----------
      const yesBtn = document.getElementById('yesBtn');
      const noBtn = document.getElementById('noBtn');
      const forgiveMsg = document.getElementById('forgiveMsg');
      const apologyText = document.getElementById('apologyText');
      const buttonGroup = document.getElementById('buttonGroup');

      let noMoveTimeout = null;

      // move "No" button to random safe position (relative to card)
      function moveNoButton() {
        if (!noBtn || noBtn.classList.contains('hidden')) return;

        const card = document.getElementById('mainCard');
        const cardRect = card.getBoundingClientRect();
        const groupRect = buttonGroup.getBoundingClientRect();

        // relative to button group
        const groupW = groupRect.width;
        const groupH = groupRect.height;
        const btnW = noBtn.offsetWidth || 120;
        const btnH = noBtn.offsetHeight || 60;

        // try to keep inside group area (with padding)
        const pad = 12;
        const maxX = Math.max(groupW - btnW - pad, 10);
        const maxY = Math.max(groupH - btnH - pad, 10);

        // random position
        let randX = Math.random() * maxX;
        let randY = Math.random() * maxY;

        // but ensure it doesn't overlap "Yes" too much (simple heuristic)
        // We'll just use random, but avoid edges
        randX = Math.min(Math.max(randX, pad), maxX);
        randY = Math.min(Math.max(randY, pad), maxY);

        noBtn.style.position = 'absolute';
        noBtn.style.left = randX + 'px';
        noBtn.style.top = randY + 'px';
        noBtn.style.right = 'auto';
        noBtn.style.bottom = 'auto';
        noBtn.style.transform = 'scale(1)';
        noBtn.style.flex = 'unset';
        noBtn.style.minWidth = 'auto';
        noBtn.style.maxWidth = 'none';
        noBtn.style.width = 'auto';
        noBtn.style.zIndex = '30';
        // ensure pointer events
        noBtn.style.pointerEvents = 'auto';
        noBtn.classList.add('btn-no--move');
      }

      // reset no button position
      function resetNoButtonPosition() {
        if (!noBtn) return;
        noBtn.style.position = '';
        noBtn.style.left = '';
        noBtn.style.top = '';
        noBtn.style.right = '';
        noBtn.style.bottom = '';
        noBtn.style.transform = '';
        noBtn.style.flex = '';
        noBtn.style.minWidth = '';
        noBtn.style.maxWidth = '';
        noBtn.style.width = '';
        noBtn.style.zIndex = '';
        noBtn.classList.remove('btn-no--move');
        // reset to default flex grow
        noBtn.style.flex = '1 0 auto';
      }

      // handle click on NO: move away + reset timer
      function handleNoClick(e) {
        e.preventDefault();
        e.stopPropagation();

        // move the no button
        moveNoButton();

        // if there is any previous timeout, clear
        if (noMoveTimeout) {
          clearTimeout(noMoveTimeout);
          noMoveTimeout = null;
        }

        // after 1.5s, if not clicked yes, reset position (optional)
        // but we want it to stay moved until yes is clicked, but we also reset if they click yes
        // Actually keep it moved until yes clicked or page reload.
        // But we also want to avoid permanent trap: if they click no, it moves. 
        // we keep it moved. fine.
      }

      // handle YES
      function handleYesClick() {
        // show forgive message
        forgiveMsg.classList.remove('hidden');
        // hide the buttons and apology text? keep apology but we can hide button group
        buttonGroup.style.display = 'none';
        // hide apology text? keep it but we can add a subtle effect
        apologyText.style.opacity = '0.6';
        // also hide no button if visible
        noBtn.style.display = 'none';
        // yes can stay visible but we hide the group

        // reset no button position (if shown, but hidden)
        resetNoButtonPosition();
        if (noMoveTimeout) {
          clearTimeout(noMoveTimeout);
          noMoveTimeout = null;
        }
      }

      // Add listeners
      yesBtn.addEventListener('click', handleYesClick);
      yesBtn.addEventListener('touchend', function(e) {
        // prevent double fire
        e.preventDefault();
        handleYesClick();
      });

      noBtn.addEventListener('click', handleNoClick);
      noBtn.addEventListener('touchend', function(e) {
        e.preventDefault();
        handleNoClick(e);
      });

      // also if user clicks no with touch, move
      // additional: if window resizes, we might want to reposition no button?
      // but it's okay.

      // small extra: if no button is moved, and they click yes, we hide everything.
      // also if they click yes, we reset all.

      // prevent accidental double tap zoom on buttons
      const allBtns = [yesBtn, noBtn];
      allBtns.forEach(btn => {
        btn.addEventListener('touchstart', function(e) {
          // just to improve feel
        }, { passive: true });
      });

      // if someone clicks on card background (not button) no effect.

      console.log('❤️ baby, forgive me!');
    })();
  </script>

</body>
</html>
